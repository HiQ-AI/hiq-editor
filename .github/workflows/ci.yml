name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  standalone-binaries:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build:bin
      - name: Verify archives and native smoke
        run: |
          (cd dist-bin && shasum -a 256 -c checksums.txt)
          mkdir binary-smoke
          tar -xzf dist-bin/hiq-editor-darwin-arm64.tar.gz -C binary-smoke
          codesign --verify --deep --strict binary-smoke/hiq-editor
          binary-smoke/hiq-editor version
          binary-smoke/hiq-editor --json list
          binary-smoke/hiq-editor --json describe upr-import
