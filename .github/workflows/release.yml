# Publish a release on a version tag.
#
# Delivery is anonymous for consumers (no token to install):
#   1. Native binaries — single-file executables for macOS / Linux / Windows,
#             cross-compiled by `bun build --compile`. No runtime on the machine;
#             `scripts/install.sh` / `.ps1` are the one-line installers, served
#             from download.hiq.earth (github.com is blocked in mainland China).
#   2. npm  — `npm publish` via **Trusted Publishing (OIDC)**, so hosts can
#             `npx @hiq-ai/hiq-editor` or depend on the package. NO npm token
#             and NO repo secret: GitHub Actions proves its identity to npm over
#             OIDC (`id-token: write`), and npm generates provenance automatically.
#             One-time setup: the package must already exist (do a single manual
#             first publish), then add this repo + workflow as a Trusted Publisher
#             in the package's npmjs.com settings.
#   3. GitHub Release — carries the binaries, checksums and the npm tarball.
#
# This package has no out-of-band data asset. The CLI calls the Editor native
# API through APISIX, so a release is just {code (npm + binaries)}.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm Trusted Publishing (OIDC) + provenance

jobs:
  # Runs on macOS because only a Mac can codesign the Darwin binaries; Bun
  # cross-compiles the Linux and Windows targets from here just as well.
  binaries:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # npm, not `bun install`: the binaries and the npm package then resolve
      # through the same package-lock.json and cannot drift apart.
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build
      - run: ./scripts/build-binaries.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist-bin/*
          retention-days: 1

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # ≥ 22.14, required by trusted publishing
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm ≥ 11.5.1; Node 22 still bundles npm 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (Trusted Publishing — no token)
        run: npm publish --access public --provenance
      - name: Pack tarball for the GitHub Release
        id: pack
        run: echo "tgz=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { name: binaries, path: dist-bin }
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist-bin/* "${{ steps.pack.outputs.tgz }}")
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  # 国内直连 GitHub 不通,CDN 才是用户实际走的下载源 —— 跟着发布一起推,
  # 不能等人想起来手动跑,否则 install.sh 会一直装到旧版本。
  mirror-cdn:
    needs: release
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOAD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOAD_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DOWNLOAD_S3_BUCKET: ${{ secrets.DOWNLOAD_S3_BUCKET }}
      DOWNLOAD_CF_DIST_ID: ${{ secrets.DOWNLOAD_CF_DIST_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/mirror-to-cdn.sh "$GITHUB_REF_NAME"

  # The installers are the path most users take, so they get exercised against
  # the real Release — with no version pinned, so this covers the default
  # `releases/latest/download` resolution too.
  verify-install:
    needs: mirror-cdn
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 装的是 CDN 上那一份 —— 用户复制粘贴的就是这一行,连同镜像是否推上去
      # 一起验;跑仓里的副本只能证明脚本本身没写错。
      - name: install.sh (CDN)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://download.hiq.earth/cli/hiq-editor/install.sh | sh
          "$HOME/.local/bin/hiq-editor" version
          "$HOME/.local/bin/hiq-editor" --json list
          "$HOME/.local/bin/hiq-editor" --json describe upr-import
      - name: install.ps1 (CDN)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://download.hiq.earth/cli/hiq-editor/install.ps1 | iex
          & "$env:LOCALAPPDATA\Programs\hiq-editor\hiq-editor.exe" version
          & "$env:LOCALAPPDATA\Programs\hiq-editor\hiq-editor.exe" --json list
          & "$env:LOCALAPPDATA\Programs\hiq-editor\hiq-editor.exe" --json describe upr-import
